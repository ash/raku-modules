name: both engines

# Every distribution in the repository is tested under Rakudo AND Raku++ on
# every push. That invariant is the reason these modules live in one repository
# rather than one each.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dists: ${{ steps.find.outputs.dists }}
      any: ${{ steps.find.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        # a distribution is any directory holding a META6.json
        run: |
          dists=$(find . -maxdepth 2 -name META6.json -not -path './.*' \
                  | sed 's|^\./||; s|/META6.json$||' | sort | jq -R . | jq -sc .)
          echo "dists=$dists" >> "$GITHUB_OUTPUT"
          [ "$dists" = "[]" ] && echo "any=false" >> "$GITHUB_OUTPUT" \
                              || echo "any=true"  >> "$GITHUB_OUTPUT"
          echo "found: $dists"

  test:
    needs: discover
    if: needs.discover.outputs.any == 'true'
    runs-on: ubuntu-latest
    # A hang is invisible from outside: t/05-tls.t under Raku++ printed
    # nothing and burned the runner's six-hour default ceiling on every push
    # for days (notes/HTTP-Simple.md tells that story). A green job takes a
    # few minutes; past fifteen it is a hang, and a hang should be a fast
    # red, not a bill.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dist: ${{ fromJSON(needs.discover.outputs.dists) }}
    name: ${{ matrix.dist }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rakudo
        uses: Raku/setup-raku@v1

      - name: Install Raku++
        run: |
          # The released install LAYOUT, not just the binary: an extension
          # build needs <prefix>/include/rakupp/rakupp_ext.h, and Build.rakumod
          # finds it relative to bin/rakupp — so the whole prefix goes in, and
          # CI still tests exactly what users download.
          url=$(gh release view --repo ash/rakupp --json assets \
                -q '.assets[] | select(.name == "rakupp-linux-x86_64.tar.gz") | .url')
          curl -sSL "$url" -o /tmp/rakupp.tar.gz
          mkdir -p "$HOME/rakupp-prefix"
          tar xzf /tmp/rakupp.tar.gz -C "$HOME/rakupp-prefix" --strip-components=1
          echo "$HOME/rakupp-prefix/bin" >> "$GITHUB_PATH"
          "$HOME/rakupp-prefix/bin/rakupp" --version
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install dependencies
        # --install-to=home, because ~/.raku is the one repository BOTH engines
        # read. zef's default is the *Rakudo installation's* `site`, which the
        # standalone rakupp binary knows nothing about — it has no idea where
        # this Rakudo lives. The first CI run died on "Could not find
        # JSON::Fast" under Raku++ having passed every test under Rakudo.
        run: zef install --deps-only --/test --install-to=home "./${{ matrix.dist }}"

      - name: Build the native extension (Raku++)
        working-directory: ${{ matrix.dist }}
        # --deps-only above skips zef's build phase, so run the hook the way
        # zef would. Without this the rakupp column only ever exercised the
        # fallback — a green suite proving nothing about the extension it
        # exists to test.
        run: |
          if [ -f Build.rakumod ]; then
            rakupp -I. -MBuild -e 'exit(Build.new.build($*CWD.Str) ?? 0 !! 1)'
          fi

      - name: Test under Rakudo
        working-directory: ${{ matrix.dist }}
        run: |
          if [ "${{ matrix.dist }}" = "JSON-Native" ]; then
            # the suite asserts which backend it exercised (see t/02-write.t)
            export JSON_NATIVE_REQUIRE_BACKEND=JSON::Fast
          fi
          if [ "${{ matrix.dist }}" = "CSV-Native" ]; then
            export CSV_NATIVE_REQUIRE_BACKEND=raku
          fi
          for t in $(find t -name '*.t' -o -name '*.rakutest' | sort); do
            echo "# $t"; raku -Ilib "$t" || exit 1
          done

      - name: Test under Raku++
        working-directory: ${{ matrix.dist }}
        run: |
          if [ "${{ matrix.dist }}" = "JSON-Native" ]; then
            # the extension was built two steps up; a fallback run here is red
            export JSON_NATIVE_REQUIRE_BACKEND=native
          fi
          if [ "${{ matrix.dist }}" = "CSV-Native" ]; then
            export CSV_NATIVE_REQUIRE_BACKEND=native
          fi
          for t in $(find t -name '*.t' -o -name '*.rakutest' | sort); do
            echo "# $t"; rakupp -Ilib "$t" || exit 1
          done
