---
apiVersion: v1
kind: ConfigMap
metadata:
  name: service-00000-config
data:
  defaults: &defaults
    retries: 0
    timeout: 0
    tls: true
  production:
    <<: *defaults
    timeout: 120
  staging: *defaults
  script: |
    #!/bin/sh
    exec /srv/service-00000 --config /etc/service-00000.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-00001
  namespace: team-1
  labels:
    app: service-00001
    tier: backend
    version: "1.1.1"
  annotations:
    description: >
      Service number 1, generated for the YAML::Native
      benchmark; it listens on port 8001.
spec:
  replicas: 2
  paused: false
  progressDeadlineSeconds: ~
  selector:
    matchLabels:
      app: service-00001
  template:
    spec:
      containers:
        - name: main
          image: "registry.example.com/service-00001:1.1.1"
          ports:
            - containerPort: 8001
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: debug
            - {name: TIMEOUT, value: "11s"}
            - name: RATIO
              value: '0.1'
          resources: {limits: {cpu: 101m, memory: 128Mi}}
          args: ["--port", "8001", '--verbose']
      weight: 0.1e0
      tolerations: []
